version: "3.1"

nlu:
- intent: greet
  examples: |
    - hey
    - hello
    - hi
    - hello there
    - good morning

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you later

- intent: affirm
  examples: |
    - yes
    - y
    - indeed

- intent: deny
  examples: |
    - no
    - never
    - not really

- intent: mood_great
  examples: |
    - perfect
    - great
    - amazing

- intent: mood_unhappy
  examples: |
    - sad
    - unhappy
    - not good

- intent: bot_challenge
  examples: |
    - are you a bot?
    - are you a human?

- intent: browse_books
  examples: |
    - Show me some popular books
    - What are the top books?
    - Can I browse books?

- intent: recommend_books
  examples: |
    - Recommend me a book
    - Suggest a novel
    - Can you recommend something good?

- intent: search_book
  examples: |
    - Find 'The Great Gatsby'
    - Search for 'Pride and Prejudice'
    - Do you have '1984'?

- intent: view_statistics
  examples: |
    - What’s the average rating for fantasy books?
    - Show me stats for science fiction
    - Can I see book statistics?
